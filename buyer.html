<script>
const P = JSON.parse(document.getElementById('payload').textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn=document.getElementById('go'), err=document.getElementById('err');
  const pw=document.getElementById('pw').value;
  err.textContent=''; btn.disabled=true; btn.textContent='Unlocking…';
  try{
    const html = await unlock(pw);
    document.open(); document.write(html); document.close();
  }catch(ex){
    err.textContent='Incorrect code. Please try again.';
    btn.disabled=false; btn.textContent='Unlock';
  }
});
</script>
